<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ryder 的學習專區</title>

<!-- 📌 iPhone 桌面 App 圖示 -->
<link rel="apple-touch-icon" href="custom-icon.png">
<link rel="icon" type="image/png" href="custom-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F3ECDC;
    --paper-dark:#E6D9B8;
    --ink:#262220;
    --ink-soft:#5b5248;
    --seal:#A63A2E;
    --indigo:#2E4A66;
    --indigo-soft:#5F7C93;
    --gold:#B8935A;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    background-image:
      radial-gradient(circle at 15% 8%, rgba(184,147,90,0.10), transparent 40%),
      radial-gradient(circle at 90% 85%, rgba(166,58,46,0.06), transparent 45%);
    font-family:"Noto Sans TC", sans-serif;
    color:var(--ink);
    min-height:100vh;
    display:flex;
    justify-content:center;
  }
  .wrap{
    width:100%;
    max-width:480px;
    padding:28px 20px 40px 20px;
  }
  header{
    text-align:center;
    margin-bottom:26px;
  }
  .eyebrow{
    font-size:12px;
    letter-spacing:3px;
    color:var(--seal);
    font-weight:700;
  }
  h1{
    font-family:"Noto Serif TC", serif;
    font-weight:900;
    font-size:26px;
    margin:6px 0 6px 0;
    letter-spacing:1px;
  }
  header p{
    margin:0;
    font-size:12.5px;
    color:var(--ink-soft);
    line-height:1.6;
  }

  .grid{
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .app-card{
    display:flex;
    align-items:center;
    gap:14px;
    padding:18px;
    border-radius:18px;
    background:#FBF7EC;
    border:1px solid rgba(38,34,32,0.08);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.6) inset,
      0 14px 26px -14px rgba(38,34,32,0.30);
    text-decoration:none;
    color:var(--ink);
    transition:transform .12s ease;
  }
  .app-card:active{ transform:scale(0.98); }

  .app-icon{
    width:52px;height:52px;
    border-radius:14px;
    background:var(--seal);
    color:#FBF7EC;
    display:flex;align-items:center;justify-content:center;
    font-size:24px;
    flex-shrink:0;
  }
  .app-info{ flex:1; min-width:0; }
  .app-title{
    font-family:"Noto Serif TC", serif;
    font-weight:700;
    font-size:16.5px;
    margin-bottom:3px;
  }
  .app-desc{
    font-size:12.5px;
    color:var(--ink-soft);
    line-height:1.5;
  }
  .app-arrow{
    font-size:18px;
    color:var(--indigo-soft);
    flex-shrink:0;
  }

  .placeholder-card{
    display:flex;
    align-items:center;
    gap:14px;
    padding:18px;
    border-radius:18px;
    background:rgba(255,255,255,0.3);
    border:1.5px dashed var(--paper-dark);
    color:var(--ink-soft);
  }
  .placeholder-icon{
    width:52px;height:52px;
    border-radius:14px;
    border:1.5px dashed var(--indigo-soft);
    display:flex;align-items:center;justify-content:center;
    font-size:20px;
    flex-shrink:0;
    color:var(--indigo-soft);
  }
  .placeholder-info .app-title{ color:var(--ink-soft); font-size:15px; }
  .placeholder-info .app-desc{ font-size:12px; line-height:1.6; }

  footer{
    margin-top:30px;
    text-align:center;
    font-size:11.5px;
    color:var(--ink-soft);
    opacity:0.7;
    line-height:1.7;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="eyebrow">個人學習網站</div>
    <h1>Ryder 的學習專區</h1>
    <p>點下方卡片進入各科目的隨身背誦 / 測驗工具</p>
  </header>

  <div class="grid">

    <!-- ============ 在這裡新增一張卡片＝一個科目 ============ -->
    <a class="app-card" href="shishuo.html">
      <div class="app-icon">📜</div>
      <div class="app-info">
        <div class="app-title">國文・師說</div>
        <div class="app-desc">隨身背誦卡・重點複習・測驗驗收</div>
      </div>
      <div class="app-arrow">›</div>
    </a>

    <!-- 之後新增其他科目時，複製上面整個 <a class="app-card">…</a>
         區塊貼在這裡，改掉 href、icon、標題和說明即可 -->

    <div class="placeholder-card">
      <div class="placeholder-icon">＋</div>
      <div class="placeholder-info">
        <div class="app-title">尚未新增其他科目</div>
        <div class="app-desc">之後有新的科目卡片，把連結加進這個頁面就會出現在這裡</div>
      </div>
    </div>

  </div>

  <footer>
    收藏這一頁到主畫面，之後所有科目都從這裡進入
  </footer>

</div>
</body>
</html>
